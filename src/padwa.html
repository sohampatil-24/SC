<!doctype html>
<html>
<head><meta charset="utf-8"><title>Unique Diwali Padwa Wishes</title><link rel="stylesheet" href="fonts.css"></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="common.js"></script>
<script>
const DUR = 15;
seed(22112026);

[[10.2, 200, 260, 'willow', 45], [10.9, 880, 300, 'peony', 330], [11.8, 540, 170, 'ring', 45],
 [12.5, 230, 420, 'peony', 30], [13.0, 850, 430, 'willow', 45], [13.6, 540, 300, 'peony', 300]].forEach(a => Fireworks.add(...a));

// ---- dawn sky, sun, clouds, hills ----
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: R(0, W), y: R(820, 1300), w: R(220, 420), v: R(8, 22), a: R(.18, .35) }));
const hills = (() => {
  const c = layer(), g = c.getContext('2d');
  const ridge = (base, amp, color, seedOff) => {
    g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) g.lineTo(x, base - amp * (.5 + .5 * Math.sin(x / 170 + seedOff)) - amp * .4 * Math.sin(x / 63 + seedOff * 2));
    g.lineTo(W, H); g.fill();
  };
  ridge(1500, 90, '#9a4a7a', 0.4);
  ridge(1560, 70, '#6a2c5c', 2.1);
  // temple + houses on the front ridge
  g.fillStyle = '#3a1640';
  const tx = 820;
  g.beginPath(); g.moveTo(tx - 90, 1620); g.lineTo(tx - 90, 1540); g.quadraticCurveTo(tx - 30, 1450, tx, 1380); g.quadraticCurveTo(tx + 30, 1450, tx + 90, 1540); g.lineTo(tx + 90, 1620); g.fill();
  g.fillRect(tx - 2, 1340, 4, 44); g.fillStyle = '#ff7a1a'; g.beginPath(); g.moveTo(tx + 2, 1340); g.lineTo(tx + 34, 1352); g.lineTo(tx + 2, 1364); g.fill();
  g.fillStyle = '#3a1640';
  for (const [hx, hw, hh] of [[60, 120, 80], [190, 100, 64], [300, 130, 90], [560, 110, 70], [960, 120, 86]]) {
    g.fillRect(hx, 1620 - hh, hw, hh + 10); g.beginPath(); g.moveTo(hx - 12, 1620 - hh); g.lineTo(hx + hw / 2, 1620 - hh - 46); g.lineTo(hx + hw + 12, 1620 - hh); g.fill();
    g.fillStyle = 'rgba(255,190,90,.85)'; g.fillRect(hx + hw / 2 - 12, 1620 - hh + 22, 24, 30); g.fillStyle = '#3a1640';
  }
  g.fillStyle = '#24102a'; g.fillRect(0, 1615, W, H - 1615);
  return c;
})();
function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1620);
  g.addColorStop(0, '#191449'); g.addColorStop(.3, '#43266f'); g.addColorStop(.6, '#b0457a'); g.addColorStop(.82, '#ef8656'); g.addColorStop(1, '#ffc479');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun rising
  const sy = lerp(1640, 1400, easeOutCubic(prog(t, 0, 5)));
  lightRays(W / 2, sy, 1100, 22, t * .06, 'rgba(255,220,150,.5)', .55);
  ctx.globalCompositeOperation = 'lighter'; glow(W / 2, sy, 700, 'rgba(255,170,90,.55)'); ctx.globalCompositeOperation = 'source-over';
  const sg = ctx.createRadialGradient(W / 2, sy - 30, 20, W / 2, sy, 160);
  sg.addColorStop(0, '#fffbe0'); sg.addColorStop(.6, '#ffd36a'); sg.addColorStop(1, '#ff9a3c');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(W / 2, sy, 160, 0, 6.28); ctx.fill();
  for (const c of clouds) {
    const x = ((c.x + t * c.v) % (W + c.w * 2)) - c.w;
    ctx.fillStyle = `rgba(255,200,210,${c.a})`;
    ctx.beginPath(); ctx.ellipse(x, c.y, c.w, 26, 0, 0, 6.28); ctx.ellipse(x + c.w * .25, c.y - 20, c.w * .45, 26, 0, 0, 6.28); ctx.fill();
  }
  Fireworks.drawFlashes(t, .25);
}
// a few birds crossing the dawn sky
const birds = Array.from({ length: 6 }, (_, i) => ({ x0: -100 - i * 70, y: 1120 + (i % 3) * 40 + R(-20, 20), v: R(120, 160), p: R(0, 6.28), s: R(.7, 1.1) }));
function drawBirds(t) {
  ctx.strokeStyle = 'rgba(40,10,40,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const b of birds) {
    const x = b.x0 + t * b.v, y = b.y - t * 12, f = Math.sin(t * 10 + b.p) * 10 * b.s;
    if (x > W + 60) continue;
    ctx.beginPath(); ctx.moveTo(x - 18 * b.s, y - f); ctx.quadraticCurveTo(x - 8 * b.s, y - 4, x, y); ctx.quadraticCurveTo(x + 8 * b.s, y - 4, x + 18 * b.s, y - f); ctx.stroke();
  }
}

// ---- marigold toran ----
function marigold(x, y, r, hue) {
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, 1, x, y, r);
  g.addColorStop(0, `hsl(${hue + 10},100%,70%)`); g.addColorStop(1, `hsl(${hue - 8},100%,42%)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = `hsla(${hue - 15},100%,30%,.5)`; ctx.lineWidth = 1.5;
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x, y, r * (.3 + k * .11), k, k + 2.4); ctx.stroke(); }
}
function mangoLeaf(x, y, len, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createLinearGradient(-12, 0, 12, 0); g.addColorStop(0, '#1d6a22'); g.addColorStop(.5, '#4caf3e'); g.addColorStop(1, '#1a5a1c');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(16, len * .45, 0, len); ctx.quadraticCurveTo(-16, len * .45, 0, 0); ctx.fill();
  ctx.restore();
}
function drawToran(t) {
  const sw = 3, rope = x => 26 + 46 * Math.abs(Math.sin(x / W * Math.PI * sw));
  for (let x = 0; x <= W; x += 22) marigold(x, rope(x), 15, x / 22 % 2 ? 32 : 46);
  for (let k = 0; k < 13; k++) {
    const x = 40 + k * 83, y0 = rope(x), n = 3 + (k % 3), sway = Math.sin(t * 1.8 + k) * .05;
    ctx.save(); ctx.translate(x, y0); ctx.rotate(sway);
    for (let j = 1; j <= n; j++) marigold(0, j * 26, 13, (j + k) % 2 ? 30 : 48);
    mangoLeaf(0, n * 26 + 10, 56, 0);
    ctx.restore();
  }
}

// ---- falling petals ----
const petals = [];
function stepPetals(t) {
  if (rnd() < (t < 9.6 ? .38 : .25)) petals.push({ x: R(0, W), y: -30, vy: R(90, 170), rot: R(0, 6.28), vr: R(-3, 3), sw: R(0, 6.28), hue: [32, 45, 350, 5][(rnd() * 4) | 0], s: R(.7, 1.3) });
  for (let i = petals.length - 1; i >= 0; i--) { const p = petals[i]; p.y += p.vy * DT; p.rot += p.vr * DT; if (p.y > H + 30) petals.splice(i, 1); }
}
function drawPetals(t) {
  for (const p of petals) {
    ctx.save(); ctx.translate(p.x + Math.sin(t * 1.5 + p.sw) * 40, p.y); ctx.rotate(p.rot); ctx.scale(p.s * (0.4 + 0.6 * Math.abs(Math.sin(t * 3 + p.sw))), p.s);
    ctx.fillStyle = `hsl(${p.hue},95%,${p.hue > 300 || p.hue < 10 ? 50 : 58}%)`;
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 15, 0, 0, 6.28); ctx.fill();
    ctx.restore();
  }
}

// ---- the new account book (chopda) ----
const BW = 380, BH = 500, BY = 1180;
function page(x0, w, word, flip) {
  // x0 = left edge, w may be scaled width
  ctx.save();
  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
  g.addColorStop(flip ? 1 : 0, '#f1e0bd'); g.addColorStop(flip ? .85 : .15, '#fff8e6'); g.addColorStop(flip ? 0 : 1, '#fff3d6');
  ctx.fillStyle = g; ctx.fillRect(x0, BY - BH / 2, w, BH);
  ctx.beginPath(); ctx.rect(x0, BY - BH / 2, w, BH); ctx.clip();
  ctx.translate(x0 + w / 2, BY); ctx.scale(w / BW, 1);
  ctx.strokeStyle = 'rgba(200,40,40,.25)'; ctx.lineWidth = 2;
  for (let y = -BH / 2 + 40; y < BH / 2 - 20; y += 34) { ctx.beginPath(); ctx.moveTo(-BW / 2 + 24, y); ctx.lineTo(BW / 2 - 24, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(200,30,30,.6)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-BW / 2 + 60, -BH / 2 + 20); ctx.lineTo(-BW / 2 + 60, BH / 2 - 20); ctx.moveTo(BW / 2 - 60, -BH / 2 + 20); ctx.lineTo(BW / 2 - 60, BH / 2 - 20); ctx.stroke();
  swastik(0, -110, 52, '#c8102e', 14);
  ctx.fillStyle = '#c8102e'; ctx.font = '120px Yatra'; ctx.textAlign = 'center'; ctx.fillText(word, 0, 130);
  ctx.restore();
}
function cover(x0, w, h) {
  ctx.save();
  const g = ctx.createLinearGradient(x0, 0, x0 + w, 0); g.addColorStop(0, '#7a0812'); g.addColorStop(.5, '#c4141f'); g.addColorStop(1, '#8a0a14');
  ctx.fillStyle = g; ctx.fillRect(x0, BY - h / 2, w, h);
  ctx.translate(x0 + w / 2, BY); ctx.scale(Math.max(.01, w / BW), h / BH);
  ctx.strokeStyle = '#ffcc4a'; ctx.lineWidth = 6; ctx.strokeRect(-BW / 2 + 18, -BH / 2 + 18, BW - 36, BH - 36);
  ctx.lineWidth = 2; ctx.strokeRect(-BW / 2 + 30, -BH / 2 + 30, BW - 60, BH - 60);
  swastik(0, -40, 60, '#ffcc4a', 14);
  ctx.fillStyle = '#ffcc4a'; ctx.font = '64px Yatra'; ctx.textAlign = 'center'; ctx.fillText('॥ श्री ॥', 0, 120);
  ctx.restore();
}
function drawBook(t, a) {
  if (a <= 0 || t < 4.9) return;
  const rise = easeOutBack(prog(t, 4.9, 5.7)), open = easeInOut(prog(t, 5.8, 7.0));
  const bob = Math.sin(t * 2) * 6 * prog(t, 7, 7.5);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - rise) * 1100 + bob);
  const spine = lerp(W / 2 - BW / 2, W / 2, open);
  ctx.fillStyle = 'rgba(30,5,20,.4)'; ctx.beginPath(); ctx.ellipse(W / 2, BY + BH / 2 + 30, 460, 40, 0, 0, 6.28); ctx.fill();
  // page block thickness
  ctx.fillStyle = '#e8d3a8'; ctx.fillRect(spine - BW * open, BY + BH / 2, BW * (1 + open), 14);
  ctx.fillStyle = '#7a0812'; ctx.fillRect(spine - BW * open - 6, BY + BH / 2 + 12, BW * (1 + open) + 12, 10);
  page(spine, BW, 'लाभ', false);
  const c = Math.cos(open * Math.PI), h = BH * (1 + .06 * Math.sin(open * Math.PI));
  if (c > 0) cover(spine, BW * c, h);
  else page(spine + BW * c, -BW * c, 'शुभ', true);
  // spine shadow
  if (open > .5) { const sg = ctx.createLinearGradient(spine - 30, 0, spine + 30, 0); sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(.5, 'rgba(90,40,0,.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = sg; ctx.fillRect(spine - 30, BY - BH / 2, 60, BH); }
  ctx.restore();
  // golden sparkles rising out of the open book
  if (open >= 1) for (let k = 0; k < 16; k++) {
    const ph = k * 2.39, life = (t * .6 + k / 16) % 1;
    sparkle(W / 2 + Math.sin(ph) * 330 * (1 - life * .3), BY - 120 - life * 420, 22 * (1 - life), t + k, (1 - life) * a);
  }
}

// ---- frame ----
const dust = makeDust(50, 'rgba(255,225,150,A)');
function renderFrame(i) {
  const t = i / FPS;
  Fireworks.step(t); stepPetals(t);
  drawSky(t);
  ctx.drawImage(Fireworks.canvas, 0, 0);
  drawBirds(t);
  ctx.drawImage(hills, 0, 0);
  drawRangoli(W / 2, 1760, 150, t * .3, .85);
  [[120, 1800], [300, 1840], [780, 1840], [960, 1800]].forEach(([x, y], k) => drawDiya(x, y, 1.05, t, k * 2.3));

  drawPetals(t);
  // scene 1 titles
  const out1 = prog(t, 4.5, 5.1), s1 = easeOutCubic(prog(t, .8, 1.8)) * (1 - out1), lift = -easeInCubic(out1) * 140;
  goldText('दिवाळी पाडवा', W / 2, 520 + lift, '$px Yatra', 124, s1, prog(t, 1.4, 2.5), { stroke: 9 });
  const sc = lerp(.6, 1, easeOutBack(prog(t, 1.1, 2.0)));
  ctx.save(); ctx.translate(W / 2, 800 + lift); ctx.scale(sc, sc); ctx.translate(-W / 2, -800);
  goldText('Happy Diwali', W / 2, 700, '$px Vibes', 150, s1, prog(t, 2.0, 3.0), { stroke: 6 });
  goldText('PADWA', W / 2, 920, '700 $px Cinzel', 220, s1, prog(t, 2.1, 3.2), { stroke: 11 });
  ctx.restore();
  plainText('बलिप्रतिपदा', W / 2, 1010 + lift, '54px Yatra', '#fff1dc', easeOutCubic(prog(t, 2.2, 3)) * (1 - out1));

  // scene 2: new year + opening the new account book
  const fade2 = 1 - prog(t, 9.3, 9.9);
  drawBook(t, fade2);
  const s2 = easeOutCubic(prog(t, 5.1, 5.9)) * fade2;
  goldText('नूतन वर्षाभिनंदन!', W / 2, 470, '$px Yatra', 100, s2, prog(t, 5.9, 7.0), { stroke: 8 });
  goldText('दिवाळी पाडव्याच्या हार्दिक शुभेच्छा!', W / 2, 568, '$px Yatra', 60, easeOutCubic(prog(t, 5.6, 6.4)) * fade2, prog(t, 6.6, 7.6), { stroke: 6 });
  const m = easeOutCubic(prog(t, 7.0, 7.8)) * fade2;
  plainText('May this New Year open new chapters', W / 2, 660, '500 40px Pop', '#fff4e6', m);
  plainText('of success, health & prosperity', W / 2, 714, '500 40px Pop', '#fff4e6', m);

  drawToran(t);
  cornerLogo(t, easeOutCubic(prog(t, .8, 1.5)) * (1 - prog(t, 9.5, 9.9)), 214);
  endCard(t, 9.7, [
    { text: 'Thank you for your trust & support', font: '500 38px Pop', color: '#ffe9c4', gap: 58 },
    { text: 'Wishing you a prosperous New Year!', font: '600 40px Pop', color: '#ffffff', gap: 90 },
    ...CONTACT], 830);
  drawDust(dust, t);
  fadeEdges(t, DUR);
}
window.ready = (async () => {
  await loadFonts([document.fonts.load('100px Yatra', 'नूतन वर्षाभिनंदन बलिप्रतिपदा ॥')]); await prepLogos();
  schedule.events = { bells: [0.5], birds: [0.3, 4.5], title: 1.0, shimmer: [1.4, 2.0, 5.9, 6.6], bookRise: 4.9, bookOpen: [5.8, 7.0], card: 9.7, cardShine: 10.6, kind: 'padwa' };
  return true;
})();
window.renderFrame = renderFrame; window.getSchedule = () => schedule; window.FRAMES = FPS * DUR;
</script>
</body>
</html>
